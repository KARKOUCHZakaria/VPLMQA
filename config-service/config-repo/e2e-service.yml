spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/tests_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://eureka-server:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  tracing:
    enabled: false

logging:
  structured: true

gateway:
  public-url: ${GATEWAY_PUBLIC_URL:http://localhost:8080}

project:
  service:
    url: ${PROJECT_SERVICE_URL:http://project-service:8088}
design:
  service:
    url: ${DESIGN_SERVICE_URL:http://design-service:8082}
