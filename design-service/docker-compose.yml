services:
  design-service:
    build: .
    env_file:
      - ../.env
    image: vplmqa/design
    ports: ["8082:8082"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      config-service: { condition: service_healthy }
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      project-service: { condition: service_healthy }
    environment:
      FIGMA_DB_HOST: postgres
      FIGMA_DB_PORT: 5432
      FIGMA_DB_NAME: design_db
      FIGMA_DB_USER: ${POSTGRES_USER}
      FIGMA_DB_PASSWORD: ${POSTGRES_PASSWORD}
      MINIO_URL: http://minio:9000



