services:
  auth-service:
    build: .
    env_file:
      - ../.env
    environment:
      SECURITY_JWT_SECRET: ${JWT_SECRET}
      SECURITY_JWT_ISSUER: vplmqa
      SECURITY_JWT_ACCESS_TOKEN_TTL_SECONDS: "3600"
      SECURITY_JWT_REFRESH_TOKEN_TTL_SECONDS: "86400"
    image: vplmqa/auth
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      config-service: { condition: service_healthy }
