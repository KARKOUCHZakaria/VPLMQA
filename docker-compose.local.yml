name: vplmqa-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vplmqa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_prod}
    ports:
      - "5434:5432"
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
      - ./infra/postgres/init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change_me_in_prod}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me_in_prod}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    volumes:
      - zookeeper-local-data:/var/lib/zookeeper/data
      - zookeeper-local-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
    volumes:
      - kafka-local-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 15s
      timeout: 30s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vplmqa}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_in_prod}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9005:9000"
      - "9006:9001"
    volumes:
      - minio-local-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  vault:
    image: hashicorp/vault:1.15.5
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 10

  vault-init:
    image: hashicorp/vault:1.15.5
    user: "0:0"
    restart: "no"
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export VAULT_TOKEN="$$(cat /run/secrets/vault_token)"
        if [ -s /run/secrets/mistral_api_key ]; then
          vault kv put secret/vplmqa/platform/mistral api_key="$$(cat /run/secrets/mistral_api_key)" >/dev/null
        fi
        echo "Vault provider secrets initialized."
    secrets:
      - vault_token
      - mistral_api_key

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  front-end:
    build:
      context: ./front-end
      args:
        VITE_GATEWAY_URL: http://localhost:8080
        VITE_MINIO_PUBLIC_BASE_URL: http://localhost:9005/figma-designs
        NGINX_CONF: nginx.local.conf
    image: vplmqa/front-end-local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:80"

  langgraph-agents:
    build:
      context: .
      dockerfile: langgraph-agents/Dockerfile
    image: vplmqa/agents-local
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
    ports:
      - "8090:8090"
      - "7900:7900"
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mistral}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
      MISTRAL_VISION_MODEL: ${MISTRAL_VISION_MODEL:-mistral-small-latest}
      TICKET_REPORT_MODEL: ${TICKET_REPORT_MODEL:-mistral-small-latest}
      TICKET_REPORT_MODELS: ${TICKET_REPORT_MODELS:-}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-4096}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.1}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_ENRICHMENT_MODEL: ${GEMINI_ENRICHMENT_MODEL:-gemini-2.5-flash}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-4096}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0.2}
      GEMINI_MIN_CALL_INTERVAL_SECONDS: ${GEMINI_MIN_CALL_INTERVAL_SECONDS:-1}
      E2E_BROWSER_CDP_URL: ${E2E_BROWSER_CDP_URL:-http://192.168.65.254:9222}
      E2E_BROWSER_CDP_REQUIRED: ${E2E_BROWSER_CDP_REQUIRED:-true}
      E2E_BROWSER_LAUNCHER_URL: ${E2E_BROWSER_LAUNCHER_URL:-http://host.docker.internal:9223/launch}
      E2E_BROWSER_CLOSE_URL: ${E2E_BROWSER_CLOSE_URL:-http://host.docker.internal:9223/close}
      E2E_BROWSER_LAUNCH_WAIT_SECONDS: ${E2E_BROWSER_LAUNCH_WAIT_SECONDS:-2}
      E2E_BROWSER_HEADLESS: "false"
      E2E_BROWSER_SLOW_MO_MS: "1200"
      E2E_BROWSER_HOLD_OPEN_SECONDS: ${E2E_BROWSER_HOLD_OPEN_SECONDS:-4}
      E2E_TARGET_BASE_URL: ${E2E_TARGET_BASE_URL:-}
      VPLM_BASE_URL: ${VPLM_BASE_URL:-}
      TARGET_BASE_URL: ${TARGET_BASE_URL:-}
      STEP_REGISTRY_DATABASE_URL: postgresql://${POSTGRES_USER:-vplmqa}:${POSTGRES_PASSWORD:-change_me_in_prod}@postgres:5432/tests_db
      RAG_DATABASE_URL: postgresql://${POSTGRES_USER:-vplmqa}:${POSTGRES_PASSWORD:-change_me_in_prod}@postgres:5432/tests_db
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /run/secrets/vault_token
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-vplmqa}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change_me_in_prod}
      STEP_FUNCTION_BUCKET: e2e-artifacts
    secrets:
      - vault_token

volumes:
  postgres-local-data:
  minio-local-data:
  kafka-local-data:
  zookeeper-local-data:
  zookeeper-local-log:
  front-end-node-modules:

secrets:
  vault_token:
    environment: VAULT_TOKEN
  mistral_api_key:
    file: ./secrets/mistral_api_key.txt
