services:
  project-service:
    build: .
    env_file:
      - ../.env
    image: vplmqa/project
    ports: ["8088:8088"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
      config-service: { condition: service_healthy }


