services:
  e2e-service:
    build:
      context: .
    ports:
      - "8083:8083"
    environment:
      - SERVER_PORT=8083
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tests_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - LANGGRAPH_AGENTS_URL=http://langgraph-agents:8090
      - VAULT_URL=http://vault:8200
      - VAULT_TOKEN_FILE=/run/secrets/vault_token
      - MANAGEMENT_TRACING_ENABLED=false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      postgres: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      kafka: { condition: service_healthy }
      langgraph-agents: { condition: service_healthy }
    secrets:
      - vault_token

secrets:
  vault_token:
    environment: VAULT_TOKEN
