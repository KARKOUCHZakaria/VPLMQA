services:
  vault:
    image: hashicorp/vault:1.15.5
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["8200:8200"]
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 10

  vault-init:
    image: hashicorp/vault:1.15.5
    user: "0:0"
    restart: "no"
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export VAULT_TOKEN="$$(cat /run/secrets/vault_token)"
        test -s /run/secrets/mistral_api_key
        vault kv put secret/vplmqa/platform/mistral api_key="$$(cat /run/secrets/mistral_api_key)" >/dev/null
        echo "Vault provider secrets initialized."
    secrets:
      - vault_token
      - mistral_api_key

secrets:
  vault_token:
    environment: VAULT_TOKEN
  mistral_api_key:
    file: ../../secrets/mistral_api_key.txt
