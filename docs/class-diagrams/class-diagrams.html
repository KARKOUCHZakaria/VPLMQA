<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VPLMQA Class Diagrams</title>
  <style>
    body { margin: 0; background: #fff; font-family: Arial, sans-serif; }
    .diagram { position: relative; width: 1400px; height: 760px; background: #fff; border: 1.8px solid #111; margin: 20px; overflow: hidden; }
    .title { position: absolute; left: 28px; top: 24px; font-weight: 800; font-size: 22px; }
    svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .class rect.outer { fill: #ffffcc; stroke: #111; stroke-width: 2; }
    .class line { stroke: #111; stroke-width: 1.5; }
    .cn { font-weight: 800; font-size: 16px; }
    .attr { font-size: 14px; }
    .mult { font-size: 14px; fill: #111; }
    .rel { stroke: #111; stroke-width: 1.5; fill: none; }
    .dash { stroke: #111; stroke-width: 1.5; stroke-dasharray: 7 7; fill: none; }
    .inherit { stroke: #111; stroke-width: 1.5; fill: none; marker-end: url(#inherit); }
    .dep { stroke: #111; stroke-width: 1.5; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrow); }
  </style>
</head>
