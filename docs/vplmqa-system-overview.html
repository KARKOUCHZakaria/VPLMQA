<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VPLMQA System Overview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #eef2f7;
      font-family: Arial, sans-serif;
    }
    .page {
      width: 1500px;
      height: 900px;
      background: linear-gradient(180deg, #fff 0%, #f8fafc 100%);
      border: 4px solid #111827;
      position: relative;
      overflow: hidden;
    }
    h1 {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      margin: 0;
      text-align: center;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0;
    }
    svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .boundary { fill: rgba(255,255,255,.75); stroke: #111827; stroke-width: 2.5; }
    .box { fill: #fff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
    .soft { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
    .agent { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; rx: 10; }
    .service { fill: #f8fbff; stroke: #bfdbfe; stroke-width: 2; rx: 10; }
    .infra { fill: #f9fafb; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
    .flow { fill: none; stroke: #111827; stroke-width: 2.4; marker-end: url(#arrow); }
    .flow2 { fill: none; stroke: #111827; stroke-width: 2.4; marker-start: url(#arrow-start); marker-end: url(#arrow); }
    .dash { fill: none; stroke: #64748b; stroke-width: 2.1; stroke-dasharray: 8 7; marker-end: url(#arrow-muted); }
    .title { font-size: 20px; font-weight: 800; fill: #111827; }
    .label { font-size: 16px; font-weight: 800; fill: #111827; }
    .small { font-size: 13px; font-weight: 700; fill: #475569; }
    .tiny { font-size: 11px; font-weight: 700; fill: #64748b; }
    .green { fill: #65a532; }
    .blue { fill: #2563eb; }
    .orange { fill: #ea580c; }
    .red { fill: #dc2626; }
    .teal { fill: #0f766e; }
    .violet { fill: #7c3aed; }
    .chip-text { font-size: 12px; font-weight: 800; fill: #fff; }
  </style>
</head>
