services:
  gateway:
    build: .
    env_file:
      - ../.env
    image: vplmqa/gateway
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    depends_on:
      config-service: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      project-service: { condition: service_healthy }
      design-service: { condition: service_healthy }
      e2e-service: { condition: service_healthy }


