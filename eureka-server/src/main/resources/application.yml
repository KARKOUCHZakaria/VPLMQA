spring:
  cloud:
    config:
      enabled: false
  application:
    name: eureka-server

server:
  port: 8761

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  instance:
    hostname: eureka-server

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

